<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Ordering - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container narrow">
  <h1 style="text-align:center">&#127828; Food Ordering</h1>
  <div class="card">
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
      <button id="tabReg" onclick="showTab('register')">Register</button>
    </div>
    <p id="msg" class="msg"></p>

    <form id="loginForm">
      <label>Email</label><input type="email" id="lEmail" required>
      <label>Password</label><input type="password" id="lPass" required>
      <button class="btn" type="submit">Login</button>
    </form>

    <form id="regForm" style="display:none">
      <label>Name</label><input type="text" id="rName" required>
      <label>Email</label><input type="email" id="rEmail" required>
      <label>Password (min 6 characters)</label><input type="password" id="rPass" required minlength="6">
      <button class="btn" type="submit">Create account</button>
    </form>
  </div>
  <p style="text-align:center;color:#777;font-size:13px">Admin demo login: admin@food.com / admin123</p>
</div>

<script src="js/app.js"></script>
<script>
  if (getToken()) window.location = getRole() === "ADMIN" ? "admin.html" : "menu.html";

  function showTab(t) {
    document.getElementById("loginForm").style.display = t === "login" ? "block" : "none";
    document.getElementById("regForm").style.display = t === "register" ? "block" : "none";
    document.getElementById("tabLogin").className = t === "login" ? "active" : "";
    document.getElementById("tabReg").className = t === "register" ? "active" : "";
    setMsg("");
  }
  function setMsg(text, ok) {
    const m = document.getElementById("msg");
    m.textContent = text;
    m.className = ok ? "msg ok" : "msg";
  }

  document.getElementById("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    try {
      const d = await api("/api/auth/login", "POST",
        { email: document.getElementById("lEmail").value, password: document.getElementById("lPass").value });
      localStorage.setItem("token", d.token);
      localStorage.setItem("role", d.role);
      localStorage.setItem("name", d.name);
      window.location = d.role === "ADMIN" ? "admin.html" : "menu.html";
    } catch (err) { setMsg(err.message); }
  });

  document.getElementById("regForm").addEventListener("submit", async e => {
    e.preventDefault();
    try {
      const d = await api("/api/auth/register", "POST", {
        name: document.getElementById("rName").value,
        email: document.getElementById("rEmail").value,
        password: document.getElementById("rPass").value });
      showTab("login");
      setMsg(d.message, true);
    } catch (err) { setMsg(err.message); }
  });
</script>
</body>
</html>
